apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Name}#
  namespace: #{NameSpace}#
spec:
  replicas: #{Replicas}#
  selector:	
    matchLabels:	
      app: #{Name}#
  template:
    metadata:
      labels:
        app: #{Name}#
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
        agentpool: #{AgentPool}#
      containers:
      - name: #{Name}#
        image: #{ContainerRegistry}#.azurecr.io/#{Name}#:#{Build.BuildNumber}#
        resources:
          limits:
            cpu: #{MaxCpuPods}#
            memory: #{MaxMemoriaPods}#
          requests:
            cpu: #{MinCpuPods}#
            memory: #{MinMemoriaPods}#
        env:
          - name: ClientId
            valueFrom:
              secretKeyRef:
                name: #{nameKvSecret}#
                key: ClientId
          - name: ClientSecret
            valueFrom:
              secretKeyRef:
                name: #{nameKvSecret}#
                key: ClientSecret
          - name: KeyVaultUrl
            valueFrom:
              secretKeyRef:
                name: #{nameKvSecret}#
                key: KeyVaultUrl
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: acr-auth-bdp
---
apiVersion: v1
kind: Service
metadata:
  name: #{Name}#
  namespace: #{NameSpace}#
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: #{ServiceIP}#
  ports:
  - port: 80
  selector:
    app: #{Name}#
