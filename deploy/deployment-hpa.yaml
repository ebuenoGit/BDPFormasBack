apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: #{Name}#
  namespace: #{NameSpace}#
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: #{Name}#
  minReplicas: #{minReplicas}#
  maxReplicas: #{maxReplicas}#
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: 80
          type: Utilization
    - type: Resource
      resource:
        name: memory
        target:
          averageUtilization: 80
          type: Utilization