syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

package Backend.Ppdm;

// The Grpc Ppdm Server
service PpdmGrpc {
	// Listar Producción Crudo Gas
	rpc ListarProduccionCrudoGas (RequestBase) returns (ResponseBase) {}

	// Guardar Información Producto Crudo Venta Gas
	rpc GuardarInfoProdCrudoVentGas (RequestBase) returns (ResponseGuardarInfoProdCrudoVentGas) {}

	// Integrador Formas Min
	rpc IntegradorFormasMin (RequestBase) returns (ResponseBase) {}

	// Valdar Formas Min
	rpc ValidarFormasMin (RequestBase) returns (ResponseBase) {}
}

//*************
//  REQUEST Ppdm
//*************
message RequestBase {
	string sJson = 1;
}

//*************
//  Response Base
//*************
message ResponseBase {
	google.protobuf.StringValue message = 1;
	int32 count = 2;
	google.protobuf.Timestamp responseTime = 3;
	google.protobuf.StringValue data = 4;
	int32 code = 5;
}

//*************
//  RESPONSE Guardar Información Producto Crudo Venta Gas
//*************
message ResponseGuardarInfoProdCrudoVentGas {
	google.protobuf.StringValue message = 1;
	int32 count = 2;
	google.protobuf.Timestamp responseTime = 3;
	bool data = 4;
	int32 code = 5;
}
